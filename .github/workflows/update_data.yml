name: Weekly Data Update

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r "PersonalDashboardProject/requirements.txt"

      - name: 🛠 Run GitHub data extractor
        run: python "PersonalDashboardProject/scripts/extract_github.py"

      - name: 🏃‍♂️ Run Strava data extractor
        run: python "PersonalDashboardProject/scripts/extract_strava.py"

      - name: 🧠 Run LeetCode data extractor
        run: python "PersonalDashboardProject/scripts/extract_leetcode.py"

      - name: 📤 Commit and push updated database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if git diff --quiet "PersonalDashboardProject/data/database.sqlite"; then
            echo "🟢 No changes in database. Skipping commit."
          else
            git add "PersonalDashboardProject/data/database.sqlite"
            git commit -m "🔄 Weekly DB update: GitHub + Strava (automated)"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          fi
